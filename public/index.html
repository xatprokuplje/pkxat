<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot nalozi</title>
<style>
    :root {
        --bg: #000000;
        --panel: #060606;
        --panel-2: #0c0c0c;
        --line: #ffffff;
        --text: #ffffff;
        --muted: #9a9a9a;
        --accent: #ffffff;
        --accent-dim: rgba(255, 255, 255, 0.15);
        --danger: #ff5555;
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --glow: 0 0 4px rgba(255, 255, 255, 0.55);
        --glow-soft: 0 0 6px rgba(255, 255, 255, 0.18);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        text-shadow: 0 0 3px rgba(255, 255, 255, 0.35);
        padding: 0;
    }
    /* Sidebar sa botovima: prvi bot na top:0/left:0, ostali se ređaju
       nadole do bottom:0. Uzan, kompaktan, sa manjim fontovima. */
    .wrap {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 210px;
        max-width: 210px;
        margin: 0;
        padding: 10px 8px 14px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.2px; text-shadow: var(--glow); }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); font-size: 9.5px; margin-top: 3px; }
    .list { display: flex; flex-direction: column; gap: 6px; }
    .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 9px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: var(--glow-soft);
    }
    .card-top { display: flex; align-items: center; gap: 8px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .info { flex: 1; min-width: 0; }
    .nick-row { display: flex; align-items: center; gap: 4px; }
    .nick-input {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        padding: 2px 4px;
        border-radius: 5px;
        width: 100%;
        max-width: 100%;
        text-shadow: var(--glow);
    }
    .nick-input:hover { border-color: var(--line); }
    .nick-input:focus { outline: none; border-color: var(--accent); background: var(--panel-2); box-shadow: var(--glow-soft); }
    .username { color: var(--muted); font-size: 9px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-label { font-size: 8.5px; color: var(--muted); white-space: nowrap; }
    .status-label.on { color: var(--accent); }
    .remove-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        width: 20px; height: 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        line-height: 1;
        flex: none;
    }
    .remove-btn:hover { border-color: var(--danger); color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 10.5px; }

    .msgs-toggle {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 9px;
        padding: 4px 7px;
        border-radius: 6px;
        cursor: pointer;
        align-self: flex-start;
    }
    .msgs-toggle:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow-soft); }
    .msgs-panel { display: none; flex-direction: column; gap: 7px; border-top: 1px solid var(--line); padding-top: 8px; }
    .msgs-panel.show { display: flex; }
    .msgs-list { display: flex; flex-direction: column; gap: 5px; }
    .msg-row { display: flex; align-items: center; gap: 5px; }
    .msg-input {
        flex: 1;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 5px 6px;
        border-radius: 5px;
        font-size: 10px;
        min-width: 0;
    }
    .msg-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow-soft); }
    .msg-remove {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        width: 18px; height: 18px;
        border-radius: 5px;
        cursor: pointer;
        flex: none;
        font-size: 10px;
        line-height: 1;
    }
    .msg-remove:hover { border-color: var(--danger); color: var(--danger); }
    .msgs-add {
        background: transparent;
        border: 1px dashed var(--line);
        color: var(--muted);
        padding: 5px 7px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 9.5px;
        align-self: flex-start;
    }
    .msgs-add:hover { border-color: var(--accent); color: var(--accent); }
    .interval-row { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--muted); }
    .interval-input {
        width: 42px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 4px 5px;
        border-radius: 5px;
        font-size: 10px;
        text-align: center;
    }
    .interval-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow-soft); }
    .msgs-save {
        align-self: flex-start;
        padding: 5px 9px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #050505;
        font-weight: 600;
        font-size: 9.5px;
        cursor: pointer;
        text-shadow: none;
    }
    .msgs-save:hover { filter: brightness(1.15); box-shadow: var(--glow-soft); }
    .msgs-hint { color: var(--muted); font-size: 8.5px; margin: 0; }
    .fab {
        position: fixed;
        right: 20px; bottom: 20px;
        width: 44px; height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: #050505;
        font-size: 22px;
        border: none;
        cursor: pointer;
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
        text-shadow: none;
        transition: transform .15s ease;
    }
    .fab:hover { transform: scale(1.06); }
    .overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 10;
    }
    .overlay.show { display: flex; }
    .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.2);
    }
    .modal h2 { margin: 0 0 4px; font-size: 15px; text-shadow: var(--glow); }
    .modal .hint { color: var(--muted); font-size: 11px; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 5px; }
    .field input {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 9px 11px;
        border-radius: 7px;
        font-size: 12.5px;
    }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: var(--glow-soft); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
        flex: 1;
        padding: 9px 12px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        font-size: 12.5px;
        cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #050505; font-weight: 600; text-shadow: none; }
    .btn:hover { filter: brightness(1.15); box-shadow: var(--glow-soft); }
    .error { color: var(--danger); font-size: 11px; margin-top: 9px; min-height: 13px; }

</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>Bot <span>nalozi</span></h1>
            <div class="sub" id="subtitle">Učitavanje...</div>
        </div>
    </header>

    <div class="list" id="list"></div>
</div>

<button class="fab" id="openAdd" title="Dodaj nalog">+</button>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2>Dodaj nalog</h2>
        <div class="hint">Unesi xat korisničko ime i API ključ. Nadimak u chatu je podrazumevano isti kao korisničko ime.</div>

        <div class="field">
            <label>Korisničko ime</label>
            <input id="fUsername" type="text" placeholder="npr. AngelDobric" autocomplete="off">
        </div>
        <div class="field">
            <label>API ključ</label>
            <input id="fApikey" type="text" placeholder="API ključ naloga" autocomplete="off">
        </div>
        <div class="field">
            <label>Nadimak u chatu (opciono)</label>
            <input id="fNickname" type="text" placeholder="Podrazumevano = korisničko ime" autocomplete="off">
        </div>

        <div class="error" id="formError"></div>

        <div class="modal-actions">
            <button class="btn" id="cancelAdd">Otkaži</button>
            <button class="btn primary" id="confirmAdd">Dodaj</button>
        </div>
    </div>
</div>

<script>
    let ADMIN_TOKEN = sessionStorage.getItem('adminToken') || '';

    function headers (json = true) {
        const h = {};
        if (json) h['Content-Type'] = 'application/json';
        if (ADMIN_TOKEN) h['x-admin-token'] = ADMIN_TOKEN;
        return h;
    }

    async function api (url, options = {}) {
        const res = await fetch(url, { ...options, headers: { ...headers(!!options.body), ...(options.headers || {}) } });
        if (res.status === 401) {
            const token = prompt('Unesi pristupni kod za admin panel:');
            if (token) {
                ADMIN_TOKEN = token;
                sessionStorage.setItem('adminToken', token);
                return api(url, options);
            }
            throw new Error('Neautorizovan pristup.');
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Greška.');
        return data;
    }

    const listEl = document.getElementById('list');
    const subtitle = document.getElementById('subtitle');
    const expandedIds = new Set();

    function renderMsgRow (text) {
        return `
            <div class="msg-row">
                <input class="msg-input" value="${escapeAttr(text)}" placeholder="Tekst poruke..." spellcheck="false">
                <button class="msg-remove" title="Ukloni poruku">×</button>
            </div>
        `;
    }

    function render (accounts) {
        if (accounts.length === 0) {
            listEl.innerHTML = '<div class="empty">Nema dodatih naloga. Klikni + da dodaš prvi.</div>';
        } else {
            listEl.innerHTML = accounts.map((a) => {
                const messages = Array.isArray(a.messages) ? a.messages : [];
                const intervalMinutes = Math.max(1, Math.round((a.messageIntervalMs || 60000) / 60000));
                return `
                <div class="card" data-id="${a.id}">
                    <div class="card-top">
                        <div class="dot ${a.connected ? 'on' : ''}"></div>
                        <div class="info">
                            <div class="nick-row">
                                <input class="nick-input" value="${escapeAttr(a.nickname)}" data-original="${escapeAttr(a.nickname)}" spellcheck="false">
                            </div>
                            <div class="username">@${escapeHtml(a.username)}</div>
                        </div>
                        <div class="status-label ${a.connected ? 'on' : ''}">${a.connected ? 'online' : 'offline'}</div>
                        <button class="remove-btn" title="Ukloni nalog">×</button>
                    </div>

                    <button class="msgs-toggle" type="button">💬 Auto-poruke (${messages.length})</button>

                    <div class="msgs-panel${expandedIds.has(String(a.id)) ? ' show' : ''}">
                        <p class="msgs-hint">Nalog šalje ove poruke u chat, jednu po jednu, u krug, na podešeni razmak.</p>
                        <div class="msgs-list">
                            ${messages.length ? messages.map(renderMsgRow).join('') : ''}
                        </div>
                        <button class="msgs-add" type="button">+ Dodaj poruku</button>
                        <div class="interval-row">
                            Razmak između poruka:
                            <input class="interval-input" type="number" min="1" step="1" value="${intervalMinutes}">
                            min
                        </div>
                        <button class="msgs-save" type="button">Sačuvaj poruke</button>
                    </div>
                </div>
            `;
            }).join('');
        }
        subtitle.textContent = `${accounts.length} ${accounts.length === 1 ? 'nalog' : 'naloga'} · svi u istom chatu`;
    }

    function escapeHtml (s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escapeAttr (s) { return escapeHtml(s); }

    async function load () {
        // Ne diramo DOM dok korisnik nešto kuca (ime, poruka, interval) -
        // pre je auto-refresh na 8s brisao ono što još nije sačuvano.
        if (isEditing) return;
        try {
            const accounts = await api('/api/accounts');
            render(accounts);
        } catch (e) {
            subtitle.textContent = e.message;
        }
    }

    let isEditing = false;
    listEl.addEventListener('focusin', (e) => {
        if (e.target.matches('input, textarea')) isEditing = true;
    });
    listEl.addEventListener('focusout', () => {
        // Mala pauza da se stigne registrovati fokus na sledeće polje
        // (npr. Tab između dva message inputa) pre nego što otključamo refresh.
        setTimeout(() => {
            if (!listEl.contains(document.activeElement)) isEditing = false;
        }, 50);
    });

    listEl.addEventListener('click', async (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        const id = card.dataset.id;

        if (e.target.classList.contains('remove-btn')) {
            if (!confirm('Ukloniti ovaj nalog? Bot će odmah izaći iz chata.')) return;
            try {
                await api(`/api/accounts/${id}`, { method: 'DELETE' });
                load();
            } catch (err) {
                alert(err.message);
            }
            return;
        }

        if (e.target.classList.contains('msgs-toggle')) {
            const panel = card.querySelector('.msgs-panel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show')) expandedIds.add(id);
            else expandedIds.delete(id);
            return;
        }

        if (e.target.classList.contains('msg-remove')) {
            e.target.closest('.msg-row').remove();
            return;
        }

        if (e.target.classList.contains('msgs-add')) {
            card.querySelector('.msgs-list').insertAdjacentHTML('beforeend', renderMsgRow(''));
            card.querySelector('.msgs-list .msg-row:last-child .msg-input').focus();
            return;
        }

        if (e.target.classList.contains('msgs-save')) {
            const messages = [...card.querySelectorAll('.msg-input')]
                .map((input) => input.value.trim())
                .filter(Boolean);
            const messageIntervalMinutes = Number(card.querySelector('.interval-input').value) || 1;

            e.target.disabled = true;
            try {
                await api(`/api/accounts/${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ messages, messageIntervalMinutes }),
                });
                load();
            } catch (err) {
                alert(err.message);
            } finally {
                e.target.disabled = false;
            }
            return;
        }
    });

    listEl.addEventListener('keydown', (e) => {
        if (e.target.classList.contains('nick-input') && e.key === 'Enter') {
            e.target.blur();
        }
    });

    listEl.addEventListener('blur', async (e) => {
        if (!e.target.classList.contains('nick-input')) return;
        const input = e.target;
        const value = input.value.trim();
        const original = input.dataset.original;
        if (!value || value === original) { input.value = original; return; }

        const id = input.closest('.card').dataset.id;
        try {
            const updated = await api(`/api/accounts/${id}`, {
                method: 'PATCH',
                body: JSON.stringify({ nickname: value }),
            });
            input.dataset.original = updated.nickname;
        } catch (err) {
            alert(err.message);
            input.value = original;
        }
    }, true);

    // Modal
    const overlay = document.getElementById('overlay');
    const openAdd = document.getElementById('openAdd');
    const cancelAdd = document.getElementById('cancelAdd');
    const confirmAdd = document.getElementById('confirmAdd');
    const formError = document.getElementById('formError');

    openAdd.addEventListener('click', () => {
        document.getElementById('fUsername').value = '';
        document.getElementById('fApikey').value = '';
        document.getElementById('fNickname').value = '';
        formError.textContent = '';
        overlay.classList.add('show');
        document.getElementById('fUsername').focus();
    });
    cancelAdd.addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });

    confirmAdd.addEventListener('click', async () => {
        const username = document.getElementById('fUsername').value.trim();
        const apikey = document.getElementById('fApikey').value.trim();
        const nickname = document.getElementById('fNickname').value.trim();

        if (!username || !apikey) {
            formError.textContent = 'Korisničko ime i API ključ su obavezni.';
            return;
        }

        confirmAdd.disabled = true;
        try {
            await api('/api/accounts', { method: 'POST', body: JSON.stringify({ username, apikey, nickname }) });
            overlay.classList.remove('show');
            load();
        } catch (err) {
            formError.textContent = err.message;
        } finally {
            confirmAdd.disabled = false;
        }
    });

    load();
    setInterval(load, 8000);
</script>
</body>
</html>
